# Copy exact values from SonarCloud → Project → Administration → General Settings
# Override locally via SONAR_PROJECT_KEY / SONAR_ORGANIZATION in .env
sonar.projectKey=lbc-rider-backend
sonar.projectName=LBC Rider Backend
sonar.projectVersion=1.0.0
# Organization key (not display name — display name is lbc_rider_backend)
sonar.organization=lbc-rider-backend

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.test.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/prisma/**
sonar.coverage.exclusions=src/server.ts,src/config/database.ts,src/lib/prisma.ts,src/utils/logger.ts,src/middleware/httpLogger.ts,src/types/**
